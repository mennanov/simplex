name = "proof"
version = "0.1.0"
defaultTargets = ["proof"]

# Aeneas Lean support library.  The rev below must equal the commit hash
# embedded in AENEAS_TAG in scripts/gen_lean.sh — blockwatch enforces this.
[[require]]
name = "Aeneas"
git = "https://github.com/AeneasVerif/aeneas"
# <block name="aeneas-rev" affects="scripts/gen_lean.sh:aeneas-tag" line-pattern='^rev = "[0-9a-f]{40}"  # AENEAS_TAG: build-\d{4}\.\d{2}\.\d{2}\.\d{6}$'>
rev = "d973341320c1d5c947a95992db2aa6f70b658ea2"  # AENEAS_TAG: build-2026.05.06.171205
# </block>
subDir = "backends/lean"

[[lean_lib]]
name = "Simplex"

[[lean_lib]]
name = "Proof"

[[lean_exe]]
name = "proof"
root = "Main"
